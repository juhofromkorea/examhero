<!DOCTYPE html>
<!--
    Thymeleaf を使うために xmlns:th を指定します。
-->
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">

    <!--
        スマートフォンでも見やすくするための設定です。
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>試験カテゴリ作成 - ExamHero</title>

    <!--
        共通CSSを読み込みます。
        src/main/resources/static/css/style.css に対応します。
    -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!--
        ページ全体を囲むコンテナです。
    -->
    <div class="page-container">

        <!--
            ログイン後画面の共通ヘッダーです。
        -->
        <header class="app-header">

            <!--
                サービス名です。
                クリックするとダッシュボードへ戻ります。
            -->
            <div class="app-logo">
                <a th:href="@{/dashboard}">ExamHero</a>
            </div>

            <!--
                カテゴリ作成画面では、一覧へ戻るリンクを表示します。
            -->
            <div class="header-actions">
                <a th:href="@{/categories}" class="secondary-button">
                    一覧へ戻る
                </a>
            </div>
        </header>

        <main>

            <!--
                フォーム全体を白いカードとして表示します。
            -->
            <section class="content-card">

                <!--
                    画面タイトルです。
                -->
                <h1 class="page-title">試験カテゴリ作成</h1>

                <!--
                    画面の説明文です。
                -->
                <p class="page-description">
                    AWS SAA、基本情報技術者試験、Java Silver など、学習したい試験名を登録してください。
                </p>

                <!--
                    カテゴリ作成フォームです。

                    th:action="@{/categories}":
                      POST /categories に送信します。

                    th:object="${examCategoryForm}":
                      Controller から渡された ExamCategoryForm とフォームを紐づけます。

                    重要:
                      #fields は th:object とセットで使うため、
                      エラーメッセージ表示も form の中に置きます。
                -->
                <form th:action="@{/categories}" th:object="${examCategoryForm}" method="post">

                    <!--
                        Service側の業務エラーを表示します。

                        例:
                        - 同じ名前のカテゴリがすでに存在します

                        #fields.hasGlobalErrors():
                          特定の入力項目ではなく、フォーム全体に関するエラーがあるか確認します。

                        注意:
                          #fields は th:object の対象が必要なので、
                          必ず th:object が付いた form の内側で使います。
                    -->
                    <div class="error-message" th:if="${#fields.hasGlobalErrors()}">
                        <p th:each="error : ${#fields.globalErrors()}" th:text="${error}">
                            エラーメッセージ
                        </p>
                    </div>

                    <!--
                        Spring Security のCSRFトークンです。
                        POST送信では基本的に必要です。
                    -->
                    <input
                        type="hidden"
                        th:name="${_csrf.parameterName}"
                        th:value="${_csrf.token}"
                    >

                    <!--
                        カテゴリ名入力欄です。
                    -->
                    <div class="form-group">
                        <label for="name">カテゴリ名</label>

                        <!--
                            th:field="*{name}" により、
                            ExamCategoryForm の name フィールドと紐づきます。
                        -->
                        <input
                            type="text"
                            th:field="*{name}"
                            placeholder="例: AWS SAA"
                        >

                        <!--
                            name にバリデーションエラーがある場合だけ表示されます。
                        -->
                        <p class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">
                            カテゴリ名エラー
                        </p>
                    </div>

                    <!--
                        説明入力欄です。
                    -->
                    <div class="form-group">
                        <label for="description">説明</label>

                        <!--
                            textarea は複数行の入力欄です。
                            説明は任意入力です。
                        -->
                        <textarea
                            th:field="*{description}"
                            rows="5"
                            placeholder="例: AWS SAA試験の頻出問題をまとめるカテゴリ"
                        ></textarea>

                        <!--
                            description にバリデーションエラーがある場合だけ表示されます。
                        -->
                        <p class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">
                            説明エラー
                        </p>
                    </div>

                    <!--
                        フォーム下部のボタン領域です。
                    -->
                    <div class="form-actions">

                        <!--
                            保存ボタンです。
                        -->
                        <button type="submit" class="primary-button inline-button">
                            保存する
                        </button>

                        <!--
                            一覧画面へ戻るリンクです。
                        -->
                        <a th:href="@{/categories}" class="back-link">
                            キャンセル
                        </a>
                    </div>
                </form>

            </section>
        </main>
    </div>

</body>
</html>
