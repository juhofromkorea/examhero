<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ダッシュボード - ExamHero</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div class="page-container">

        <header class="app-header">
            <div class="app-logo">
                <a th:href="@{/dashboard}">ExamHero</a>
            </div>

            <div class="header-actions">
                <span class="login-user">
                    ログイン中:
                    <strong th:text="${loginEmail}">user@example.com</strong>
                </span>

                <form th:action="@{/logout}" method="post" class="logout-form">
                    <input
                        type="hidden"
                        th:name="${_csrf.parameterName}"
                        th:value="${_csrf.token}"
                    >

                    <button type="submit" class="secondary-button">
                        ログアウト
                    </button>
                </form>
            </div>
        </header>

        <main>

            <section class="hero-section">
                <h1>ダッシュボード</h1>
                <p>
                    学習するカテゴリを選んで、問題演習を始めましょう。
                </p>
            </section>

            <section class="stats-grid">
                <div class="stat-card">
                    <p class="stat-label">試験カテゴリ</p>
                    <p class="stat-value" th:text="${categoryCount}">0</p>
                    <p class="stat-description">
                        登録済みの試験カテゴリ数です。
                    </p>
                </div>

                <div class="stat-card">
                    <p class="stat-label">問題カード</p>
                    <p class="stat-value" th:text="${questionCount}">0</p>
                    <p class="stat-description">
                        登録した問題カードの合計数です。
                    </p>
                </div>

                <div class="stat-card">
                    <p class="stat-label">今日解いた問題</p>
                    <p class="stat-value" th:text="${todayReviewCount}">0</p>
                    <p class="stat-description">
                        今日解答した問題数です。
                    </p>
                </div>
            </section>

            <section class="action-section">

                <div
                    style="display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap;"
                >
                    <h2>学習カテゴリ</h2>

                    <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                        <a class="secondary-button inline-button" th:href="@{/categories}">
                            カテゴリ管理
                        </a>

                        <a class="primary-button inline-button" th:href="@{/questions/new}">
                            問題を登録
                        </a>
                    </div>
                </div>

                <!-- カテゴリがまだない場合 -->
                <div class="content-card" th:if="${#lists.isEmpty(categories)}">
                    <p class="page-description">
                        まだ試験カテゴリがありません。まずはカテゴリを作成してください。
                    </p>

                    <a class="primary-button inline-button" th:href="@{/categories/new}">
                        カテゴリを作成する
                    </a>
                </div>

                <!--
                    カテゴリ一覧です。
                    カテゴリをクリックすると、問題文一覧ではなく「問題番号一覧」に移動します。
                -->
                <div class="action-grid" th:if="${!#lists.isEmpty(categories)}">

                    <a
                        class="action-card"
                        th:each="category : ${categories}"
                        th:href="@{/questions/categories/{id}/select(id=${category.id})}"
                    >
                        <h3 th:text="${category.name}">
                            AWS SAA
                        </h3>

                        <p
                            th:if="${category.description != null and !#strings.isEmpty(category.description)}"
                            th:text="${category.description}"
                        >
                            このカテゴリの説明です。
                        </p>

                        <p th:if="${category.description == null or #strings.isEmpty(category.description)}">
                            このカテゴリの問題を解きます。
                        </p>
                    </a>
                </div>

            </section>

        </main>
    </div>

</body>
</html>
