<!DOCTYPE html>
<!--
    Thymeleaf を使うために xmlns:th を指定します。
    th:text, th:href, th:if などの Thymeleaf 専用属性を使えるようになります。
-->
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">

    <!--
        スマートフォンでも見やすくするための設定です。
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>問題カード詳細 - ExamHero</title>

    <!--
        共通CSSを読み込みます。
        src/main/resources/static/css/style.css に対応します。
    -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!--
        ログイン後画面の共通コンテナです。
    -->
    <div class="page-container">

        <!--
            ログイン後画面の共通ヘッダーです。
        -->
        <header class="app-header">

            <!--
                サービス名です。
                クリックするとダッシュボードへ戻ります。
            -->
            <div class="app-logo">
                <a th:href="@{/dashboard}">ExamHero</a>
            </div>

            <!--
                ログイン中ユーザー表示と、問題一覧へ戻るリンクです。
            -->
            <div class="header-actions">

                <!--
                    Controller から渡された loginEmail を表示します。
                    QuestionController の detail() で
                    model.addAttribute("loginEmail", ...) しています。
                -->
                <span class="login-user">
                    ログイン中:
                    <strong th:text="${loginEmail}">user@example.com</strong>
                </span>

                <!--
                    問題一覧へ戻るリンクです。
                -->
                <a th:href="@{/questions}" class="secondary-button">
                    問題一覧へ戻る
                </a>
            </div>
        </header>

        <main>

            <!--
                問題カード詳細全体を白いカードとして表示します。
            -->
            <section class="content-card">

                <!--
                    画面タイトルです。
                -->
                <h1 class="page-title">問題カード詳細</h1>

                <!--
                    画面の説明文です。
                -->
                <p class="page-description">
                    登録した問題文、選択肢、正解、解説を確認できます。
                </p>

                <!--
                    カテゴリ名です。
                    questionCard.examCategory.name により、
                    問題カードに紐づいている試験カテゴリ名を表示します。
                -->
                <div class="form-group">
                    <label>試験カテゴリ</label>

                    <div class="empty-message" style="text-align: left;">
                        <strong th:text="${questionCard.examCategory.name}">
                            AWS SAA
                        </strong>
                    </div>
                </div>

                <!--
                    問題文です。
                    th:text はHTMLタグを文字として安全に表示します。
                    ユーザー入力を表示するときは、基本的に th:utext より th:text が安全です。
                -->
                <div class="form-group">
                    <label>問題文</label>

                    <div class="empty-message" style="text-align: left; white-space: pre-wrap;" th:text="${questionCard.questionText}">
                        Amazon S3 のストレージクラスに関する説明として正しいものはどれか。
                    </div>
                </div>

                <!--
                    選択肢一覧です。
                    初期MVPでは4択問題のみを扱います。
                -->
                <div class="form-group">
                    <label>選択肢</label>

                    <table class="list-table">
                        <tbody>
                            <!--
                                選択肢Aです。
                                正解がAの場合は「正解」ラベルを表示します。
                            -->
                            <tr>
                                <th style="width: 90px;">A</th>
                                <td style="white-space: pre-wrap;" th:text="${questionCard.optionA}">
                                    選択肢A
                                </td>
                                <td style="width: 90px;">
                                    <strong th:if="${questionCard.correctAnswer == 'A'}">
                                        正解
                                    </strong>
                                </td>
                            </tr>

                            <!--
                                選択肢Bです。
                            -->
                            <tr>
                                <th>B</th>
                                <td style="white-space: pre-wrap;" th:text="${questionCard.optionB}">
                                    選択肢B
                                </td>
                                <td>
                                    <strong th:if="${questionCard.correctAnswer == 'B'}">
                                        正解
                                    </strong>
                                </td>
                            </tr>

                            <!--
                                選択肢Cです。
                            -->
                            <tr>
                                <th>C</th>
                                <td style="white-space: pre-wrap;" th:text="${questionCard.optionC}">
                                    選択肢C
                                </td>
                                <td>
                                    <strong th:if="${questionCard.correctAnswer == 'C'}">
                                        正解
                                    </strong>
                                </td>
                            </tr>

                            <!--
                                選択肢Dです。
                            -->
                            <tr>
                                <th>D</th>
                                <td style="white-space: pre-wrap;" th:text="${questionCard.optionD}">
                                    選択肢D
                                </td>
                                <td>
                                    <strong th:if="${questionCard.correctAnswer == 'D'}">
                                        正解
                                    </strong>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!--
                    正解表示です。
                    一覧でも見えますが、詳細画面でも分かりやすく表示します。
                -->
                <div class="form-group">
                    <label>正解</label>

                    <div class="success-message" style="margin-bottom: 0;" th:text="${questionCard.correctAnswer}">
                        A
                    </div>
                </div>

                <!--
                    解説です。
                    解説は任意入力なので、入力されている場合と未入力の場合で表示を分けます。
                -->
                <div class="form-group">
                    <label>解説</label>

                    <!--
                        解説が入力されている場合の表示です。
                    -->
                    <div
                        class="empty-message"
                        style="text-align: left; white-space: pre-wrap;"
                        th:if="${questionCard.explanation != null and !#strings.isEmpty(questionCard.explanation)}"
                        th:text="${questionCard.explanation}"
                    >
                        解説文がここに表示されます。
                    </div>

                    <!--
                        解説が未入力の場合の表示です。
                    -->
                    <div
                        class="empty-message"
                        th:if="${questionCard.explanation == null or #strings.isEmpty(questionCard.explanation)}"
                    >
                        解説はまだ登録されていません。
                    </div>
                </div>

                <!--
                    作成日時・更新日時です。
                -->
                <div class="form-group">
                    <label>登録情報</label>

                    <table class="list-table">
                        <tbody>
                            <tr>
                                <th style="width: 140px;">作成日時</th>

                                <!--
                                    #temporals.format は LocalDateTime を見やすい文字列に変換します。
                                -->
                                <td th:text="${#temporals.format(questionCard.createdAt, 'yyyy/MM/dd HH:mm')}">
                                    2026/05/14 10:00
                                </td>
                            </tr>

                            <tr>
                                <th>更新日時</th>

                                <!--
                                    updatedAt はまだ一度も編集していない場合 null の可能性があります。
                                -->
                                <td>
                                    <span
                                        th:if="${questionCard.updatedAt != null}"
                                        th:text="${#temporals.format(questionCard.updatedAt, 'yyyy/MM/dd HH:mm')}"
                                    >
                                        2026/05/14 10:30
                                    </span>

                                    <span th:if="${questionCard.updatedAt == null}">
                                        未更新
                                    </span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!--
                    画面下部の操作ボタンです。
                    現時点では編集・削除は未実装なので、戻るリンクだけにしています。
                -->
                <div class="form-actions">

                    <!--
                        問題一覧へ戻ります。
                    -->
                    <a th:href="@{/questions}" class="primary-button inline-button">
                        問題一覧へ戻る
                    </a>

                    <!--
                        ダッシュボードへ戻ります。
                    -->
                    <a th:href="@{/dashboard}" class="back-link">
                        ダッシュボードへ戻る
                    </a>
                </div>

            </section>
        </main>
    </div>

</body>
</html>
