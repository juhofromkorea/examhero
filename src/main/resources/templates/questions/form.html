<!DOCTYPE html>
<!--
    Thymeleaf を使うために xmlns:th を指定します。
    th:action, th:object, th:field, th:each などを使えるようになります。
-->
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">

    <!--
        スマートフォンでも見やすくするための設定です。
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>問題カード作成 - ExamHero</title>

    <!--
        共通CSSを読み込みます。
        src/main/resources/static/css/style.css に対応します。
    -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!--
        ログイン後画面の共通コンテナです。
    -->
    <div class="page-container">

        <!--
            ログイン後画面の共通ヘッダーです。
        -->
        <header class="app-header">

            <!--
                サービス名です。
                クリックするとダッシュボードへ戻ります。
            -->
            <div class="app-logo">
                <a th:href="@{/dashboard}">ExamHero</a>
            </div>

            <!--
                ログイン中ユーザー表示と、一覧へ戻るリンクです。
            -->
            <div class="header-actions">

                <!--
                    Controller から渡された loginEmail を表示します。
                    QuestionController の newForm() や create() で
                    model.addAttribute("loginEmail", ...) しています。
                -->
                <span class="login-user">
                    ログイン中:
                    <strong th:text="${loginEmail}">user@example.com</strong>
                </span>

                <!--
                    問題カード一覧へ戻るリンクです。
                -->
                <a th:href="@{/questions}" class="secondary-button">
                    問題一覧へ戻る
                </a>
            </div>
        </header>

        <main>

            <!--
                フォーム全体を白いカードとして表示します。
            -->
            <section class="content-card">

                <!--
                    画面タイトルです。
                -->
                <h1 class="page-title">問題カード作成</h1>

                <!--
                    画面の説明文です。
                -->
                <p class="page-description">
                    4択形式の問題カードを1問ずつ登録できます。まずは問題文、選択肢、正解を入力してください。
                </p>

                <!--
                    カテゴリが1件もない場合の案内です。

                    問題カードは必ずカテゴリに所属する必要があります。
                    そのため、カテゴリがない場合は問題登録フォームを表示せず、
                    先にカテゴリ作成へ誘導します。
                -->
                <div class="empty-message" th:if="${#lists.isEmpty(categories)}">
                    問題カードを作成するには、先に試験カテゴリを作成する必要があります。
                    <br>
                    <a th:href="@{/categories/new}" class="back-link">
                        試験カテゴリを作成する
                    </a>
                </div>

                <!--
                    カテゴリがある場合だけ、問題カード作成フォームを表示します。
                -->
                <form
                    th:if="${!#lists.isEmpty(categories)}"
                    th:action="@{/questions}"
                    th:object="${questionCardForm}"
                    method="post"
                >

                    <!--
                        Service側の業務エラーを表示します。

                        例:
                        - カテゴリが見つかりません
                        - ログイン中ユーザーのカテゴリではありません

                        #fields は th:object とセットで使うため、
                        必ず th:object が付いた form の内側で使います。
                    -->
                    <div class="error-message" th:if="${#fields.hasGlobalErrors()}">
                        <p th:each="error : ${#fields.globalErrors()}" th:text="${error}">
                            エラーメッセージ
                        </p>
                    </div>

                    <!--
                        Spring Security のCSRFトークンです。
                        POST送信では基本的に必要です。
                    -->
                    <input
                        type="hidden"
                        th:name="${_csrf.parameterName}"
                        th:value="${_csrf.token}"
                    >

                    <!--
                        試験カテゴリ選択欄です。

                        問題カードは、どの試験カテゴリに属するかを必ず指定します。
                        画面ではカテゴリ名を表示しますが、送信する値はカテゴリIDです。
                    -->
                    <div class="form-group">
                        <label for="examCategoryId">試験カテゴリ</label>

                        <!--
                            th:field="*{examCategoryId}" により、
                            QuestionCardForm の examCategoryId と紐づきます。

                            th:each:
                              Controller から渡された categories を1件ずつ取り出します。

                            th:value:
                              送信する値です。ここでは category.id を送ります。

                            th:text:
                              画面に表示する文字です。ここでは category.name を表示します。
                        -->
                        <select th:field="*{examCategoryId}">
                            <option value="">カテゴリを選択してください</option>

                            <option
                                th:each="category : ${categories}"
                                th:value="${category.id}"
                                th:text="${category.name}"
                            >
                                AWS SAA
                            </option>
                        </select>

                        <!--
                            examCategoryId にバリデーションエラーがある場合だけ表示されます。
                        -->
                        <p class="field-error" th:if="${#fields.hasErrors('examCategoryId')}" th:errors="*{examCategoryId}">
                            カテゴリエラー
                        </p>
                    </div>

                    <!--
                        問題文入力欄です。
                    -->
                    <div class="form-group">
                        <label for="questionText">問題文</label>

                        <!--
                            th:field="*{questionText}" により、
                            QuestionCardForm の questionText と紐づきます。
                        -->
                        <textarea
                            th:field="*{questionText}"
                            rows="7"
                            placeholder="例: Amazon S3 のストレージクラスに関する説明として正しいものはどれか。"
                        ></textarea>

                        <!--
                            questionText にバリデーションエラーがある場合だけ表示されます。
                        -->
                        <p class="field-error" th:if="${#fields.hasErrors('questionText')}" th:errors="*{questionText}">
                            問題文エラー
                        </p>
                    </div>

                    <!--
                        選択肢A入力欄です。
                    -->
                    <div class="form-group">
                        <label for="optionA">選択肢A</label>

                        <input
                            type="text"
                            th:field="*{optionA}"
                            placeholder="選択肢Aを入力してください"
                        >

                        <p class="field-error" th:if="${#fields.hasErrors('optionA')}" th:errors="*{optionA}">
                            選択肢Aエラー
                        </p>
                    </div>

                    <!--
                        選択肢B入力欄です。
                    -->
                    <div class="form-group">
                        <label for="optionB">選択肢B</label>

                        <input
                            type="text"
                            th:field="*{optionB}"
                            placeholder="選択肢Bを入力してください"
                        >

                        <p class="field-error" th:if="${#fields.hasErrors('optionB')}" th:errors="*{optionB}">
                            選択肢Bエラー
                        </p>
                    </div>

                    <!--
                        選択肢C入力欄です。
                    -->
                    <div class="form-group">
                        <label for="optionC">選択肢C</label>

                        <input
                            type="text"
                            th:field="*{optionC}"
                            placeholder="選択肢Cを入力してください"
                        >

                        <p class="field-error" th:if="${#fields.hasErrors('optionC')}" th:errors="*{optionC}">
                            選択肢Cエラー
                        </p>
                    </div>

                    <!--
                        選択肢D入力欄です。
                    -->
                    <div class="form-group">
                        <label for="optionD">選択肢D</label>

                        <input
                            type="text"
                            th:field="*{optionD}"
                            placeholder="選択肢Dを入力してください"
                        >

                        <p class="field-error" th:if="${#fields.hasErrors('optionD')}" th:errors="*{optionD}">
                            選択肢Dエラー
                        </p>
                    </div>

                    <!--
                        正解選択欄です。

                        初期MVPでは、正解は A / B / C / D のどれか1つです。
                        QuestionCardForm 側でも @Pattern によって
                        A〜D以外の値は受け付けないようにしています。
                    -->
                    <div class="form-group">
                        <label for="correctAnswer">正解</label>

                        <select th:field="*{correctAnswer}">
                            <option value="">正解を選択してください</option>
                            <option value="A">A</option>
                            <option value="B">B</option>
                            <option value="C">C</option>
                            <option value="D">D</option>
                        </select>

                        <p class="field-error" th:if="${#fields.hasErrors('correctAnswer')}" th:errors="*{correctAnswer}">
                            正解エラー
                        </p>
                    </div>

                    <!--
                        解説入力欄です。

                        解説は任意入力です。
                        ただし、QuestionCardForm 側で最大3000文字に制限しています。
                    -->
                    <div class="form-group">
                        <label for="explanation">解説</label>

                        <textarea
                            th:field="*{explanation}"
                            rows="6"
                            placeholder="例: S3 Standard-IA はアクセス頻度が低いデータ向けのストレージクラスです。"
                        ></textarea>

                        <p class="field-error" th:if="${#fields.hasErrors('explanation')}" th:errors="*{explanation}">
                            解説エラー
                        </p>
                    </div>

                    <!--
                        フォーム下部のボタン領域です。
                    -->
                    <div class="form-actions">

                        <!--
                            保存ボタンです。
                            押すと POST /questions に送信されます。
                        -->
                        <button type="submit" class="primary-button inline-button">
                            保存する
                        </button>

                        <!--
                            問題一覧画面へ戻るリンクです。
                        -->
                        <a th:href="@{/questions}" class="back-link">
                            キャンセル
                        </a>
                    </div>
                </form>

            </section>
        </main>
    </div>

</body>
</html>
